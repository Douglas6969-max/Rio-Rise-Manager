<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rio Rise Manager</title>

<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#e2e8f0;
  --accent:#22c55e;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{background:var(--bg);color:var(--text);}

.screen{display:none;padding:20px;max-width:500px;margin:auto;}
.active{display:block;}

header{text-align:center;margin-bottom:20px;}

.card{
  background:var(--card);
  padding:18px;
  border-radius:14px;
  margin-bottom:12px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.card:active{transform:scale(.97);}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  background:var(--accent);
  color:white;
  font-weight:bold;
}

.back{background:#334155;}

.toggle{display:flex;gap:10px;margin-top:10px;}

.toggle div{
  flex:1;
  padding:14px;
  text-align:center;
  border-radius:12px;
  background:#334155;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}

.toggle .on{
  background:var(--accent);
  color:white;
  transform:scale(1.03);
}

.lista div{padding:8px;border-bottom:1px solid #334155;}

.total{
  margin-top:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

/* dinheiro animado */
.money{
  position:fixed;
  left:50%;
  top:60%;
  transform:translateX(-50%);
  font-size:22px;
  font-weight:bold;
  animation:up 1s forwards;
}

@keyframes up{
  0%{opacity:1;transform:translate(-50%,0);}
  100%{opacity:0;transform:translate(-50%,-80px);}
}

/* popup final */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup-box{
  background:var(--card);
  padding:20px;
  border-radius:15px;
  text-align:center;
  animation:scaleIn .2s;
}

@keyframes scaleIn{
  from{transform:scale(.8);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

</style>
</head>

<body>

<!-- MENU -->
<div id="menu" class="screen active">
<header>
<h1>🚚 Rio Rise</h1>
<small>Manager • Douglas</small>
</header>

<div class="card" onclick="entrar('lixeiro')">🗑️ Lixeiro</div>
<div class="card" onclick="entrar('caminhao')">🚛 Caminhão</div>
<div class="card" onclick="entrar('comida')">🍔 Entregador</div>
</div>

<!-- APP -->
<div id="app" class="screen">
<header><h1 id="titulo"></h1></header>

<div class="toggle">
<div id="vip">VIP 1.5x</div>
<div id="double">2x</div>
</div>

<button onclick="add()">Adicionar</button>
<button onclick="finish()">Finalizar</button>
<button class="back" onclick="voltar()">Voltar</button>

<div class="lista" id="lista"></div>
<div class="total" id="total">R$ 0</div>
</div>

<!-- popup -->
<div id="popup" class="popup">
  <div class="popup-box">
    <h2>💸 Finalizado</h2>
    <p id="resumo"></p>
    <button onclick="fechar()">OK</button>
  </div>
</div>

<audio id="money" src="money.mp3" preload="auto"></audio>
<audio id="click" src="click.mp3" preload="auto"></audio>

<script>

let sessao=[];
let trabalhoAtual="";

function som(id){
  let original=document.getElementById(id);
  let s=original.cloneNode(); // remove delay
  s.play();
}

const vip=document.getElementById("vip");
const double=document.getElementById("double");

vip.onclick=()=>{vip.classList.toggle("on");som("click");};
double.onclick=()=>{double.classList.toggle("on");som("click");};

function entrar(tipo){
  som("click");

  trabalhoAtual=tipo;

  document.getElementById("menu").classList.remove("active");
  document.getElementById("app").classList.add("active");

  document.getElementById("titulo").innerText=tipo;

  sessao=[];
  render();
}

function voltar(){
  som("click");
  document.getElementById("menu").classList.add("active");
  document.getElementById("app").classList.remove("active");
}

function add(){
  let v=Number(prompt("Valor"));
  if(!v) return;

  let b1=vip.classList.contains("on")?v*0.5:0;
  let b2=double.classList.contains("on")?v:0;

  let total=v+b1+b2;

  sessao.push(total);

  som("money");

  animar(total);

  render();
}

function animar(valor){
  let el=document.createElement("div");
  el.className="money";
  el.innerText="+R$ "+valor;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}

function render(){
  let lista=document.getElementById("lista");
  lista.innerHTML="";
  let soma=0;

  sessao.forEach((e,i)=>{
    soma+=e;
    lista.innerHTML+=`<div>${i+1}) R$ ${e}</div>`;
  });

  document.getElementById("total").innerText="R$ "+soma;
}

function finish(){
  if(!sessao.length) return;

  let soma=sessao.reduce((a,b)=>a+b,0);

  document.getElementById("resumo").innerHTML=
  `Entregas: ${sessao.length}<br>Total: R$ ${soma}`;

  document.getElementById("popup").style.display="flex";

  som("money");

  sessao=[];
  render();
}

function fechar(){
  document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
